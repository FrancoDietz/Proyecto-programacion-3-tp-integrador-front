<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachopos Xavi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://img.magnific.com/vector-premium/ilustracion-vectorial-diseno-logotipo-restaurante-fondo-blanco_833755-21687.jpg?semt=ais_hybrid&w=740&q=80">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <button class="btn-header-action" type="button" onclick="abrirRedes()">
                <img
                    class="btn-icon"
                    src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"
                    alt="Redes"
                >
                <span>Redes</span>
            </button>

            <button class="btn-header-action" type="button" onclick="abrirCupon()">
                <img
                    class="btn-icon"
                    src="https://cdn-icons-png.flaticon.com/512/726/726476.png"
                    alt="Cupón"
                >
                <span>Cupón</span>
            </button>
        </div>

        <div class="logo-container">
            <img
                class="logo-header"
                src="https://img.magnific.com/vector-premium/ilustracion-vectorial-diseno-logotipo-restaurante-fondo-blanco_833755-21687.jpg?semt=ais_hybrid&w=740&q=80"
                alt="Cachopo Xavi"
            >
        </div>
    </header>

    <main class="main">
        <div id="login">
            <form id="form-login">
                <label for="input-nombre">Ingrese su nombre:</label>
                <input type="text" id="input-nombre" required>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </div>
    </main>

    <script src="login.js"></script>
</body>

</html>
